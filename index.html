/* Layout: ficha del cliente arriba, resumen por estado, tarjetas de propiedades en grilla agrupadas por fuente */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dfe3dd;
  --accent:#2f6b4f; --accent-soft:#e3efe8;

  --info:#285d8f; --info-soft:#e2ecf6;
  --bad:#9b2c2c; --bad-soft:#f7e3e3;
  --display:"Fraunces", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa69f; --line:#2c3531;
  --accent:#7cc39d; --accent-soft:#1f3329; --warn:#e9b25c; --warn-soft:#3a2d17;

:root[data-theme="dark"]{

  --info:#8ab8e6; --info-soft:#1c2c3c; --bad:#ec8b8b; --bad-soft:#3a2020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:28px}

h1{font-size:clamp(26px,4vw,34px)} h2{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

section{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card.alt{border-style:dashed}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.addr{font-weight:700;font-size:16px;line-height:1.3}
.zone{color:var(--muted);font-size:13px}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.over{font-size:11px;font-weight:700;color:var(--warn);display:block;text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}

.note{font-size:13px;color:var(--muted)}

.agency{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;width:100%}
.btn.act{flex:1 1 150px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;font-size:16px;font-weight:800;border-radius:12px;border:0;text-align:center}
.btn.act.tel{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.btn.act.wsp{background:var(--accent);color:var(--surface)}
.btn.act.mod{background:#f5c518;color:#2b2000}
.btn.act.del{background:#c0392b;color:#fff}

:root[data-theme="dark"] .btn.act.del{background:#d9534f;color:#fff}
.btn.act:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn{font-weight:700;text-decoration:none;border-radius:8px;padding:5px 10px;font-size:13px}
.btn.wa{background:var(--accent);color:var(--surface)}
.btn.src{border:1px solid var(--line);color:var(--fg)}
.state{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 9px;background:var(--info-soft);color:var(--info);white-space:nowrap}
.legend{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

<style>

</style>

<script>
const D=JSON.parse(document.getElementById("data").textContent);
const enc=encodeURIComponent;
const fmt=n=>"USD "+n.toLocaleString("es-AR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={encontrada:["Encontrada",""],consultada:["Consultada","s-consultada"],comparte:["Comparte","s-comparte"],"no comparte":["No comparte","s-no"],enviada:["Enviada al cliente","s-enviada"]};
let cur=D.clients[0].id, filt="all";
try{const h=location.hash.slice(1);if(D.clients.some(c=>c.id===h))cur=h}catch(e){}
document.getElementById("updated").textContent=`Actualizado el ${D.updated}. Los links y nombres de inmobiliarias son solo para uso interno.`;
function card(p,c){
  const B=c.budget;
  const over=p.price>B?`<span class="over">+${Math.round((p.price/B-1)*100)}% del presupuesto</span>`:"";
  const tags=[...(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`),...(p.warn||[]).map(t=>`<span class="tag warn">${esc(t)}</span>`),...(p.no||[]).map(t=>`<span class="tag no">${esc(t)}</span>`)].join("");
  const msg=`Hola, ¿cómo estás? Soy Laura de Oggi Prop. Te escribo por la propiedad de ${p.addr} (${p.amb} amb, ${fmt(p.price)}). ¿Sigue disponible? ¡Gracias!`;
  const contact=p.wa?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${p.wa}?text=${enc(msg)}">WhatsApp</a>`:"";
  const who=p.ag?`${esc(p.ag)}${p.share?` · comparte ${p.share}`:""}${p.tel?`<br>Tel. ${esc(p.tel)}`:""}`:`${esc(p.portal)} · WhatsApp no visible sin consultar`;
  const st=ST[p.st]||ST.encontrada;
  return `<div class="card${p.alt?" alt":""}">
    <div class="top"><div style="min-width:0"><div class="addr">${esc(p.addr)}</div><div class="zone">${esc(p.zone)}</div></div>
      <div><div class="price">${fmt(p.price)}</div>${over}</div></div>
    <div class="facts"><span><b>${p.amb}</b> amb.</span><span><b>${esc(p.m2)}</b></span>${p.exp?`<span>Expensas <b>${esc(p.exp)}</b></span>`:""}</div>
    <div class="tags">${tags}</div>
    ${p.note?`<div class="note">${esc(p.note)}</div>`:""}
    <div class="foot"><div class="agency">${who}</div><div class="links"><span class="state ${st[1]}">${st[0]}</span>${contact}${p.src?`<a class="btn src" target="_blank" rel="noopener" href="${p.src}">Ver aviso</a>`:""}</div></div>
  </div>`;
}
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSdzDL6Pt-PmZ0TnjMf0HgNhyydYLoj1MIFzFVmec21X0U2d_w/viewform?usp=pp_url";
function formLink(c,act){const f=c.f||{};const e={208308177:c.name,1754113943:f.tel,629327055:f.zona,1689299498:"Compra",1602668702:f.pres,82866962:f.amb,354755489:f.m2,57817142:f.req,2027179484:f.org,753988462:act};return FORM+Object.entries(e).filter(([k,v])=>v).map(([k,v])=>"&entry."+k+"="+encodeURIComponent(v)).join("")}
function render(){
  const c=D.clients.find(x=>x.id===cur);
  document.getElementById("tabs").innerHTML=[...D.clients].sort((a,b)=>(!!a.closed)-(!!b.closed)).map(x=>`<button type="button" role="tab" aria-selected="${x.id===cur}" data-id="${x.id}"${x.closed?' style="opacity:.55"':''}>${esc(x.name)}${x.closed?' · cerrado':''}<span class="n">${x.props.length}</span></button>`).join("");
  const P=c.props, cnt=s=>P.filter(p=>p.st===s).length;
  document.getElementById("client").innerHTML=`<div class="client-head"><div style="display:grid;gap:4px"><div class="eyebrow">Cliente · pedido de ${esc(c.origin)}${c.closed?` · <b>Búsqueda cerrada</b>${c.closed===true?'':' el '+esc(c.closed)}`:''}${c.version?` · búsqueda modificada (v${esc(String(c.version))})`:''}</div><h2>${esc(c.name)}</h2>${c.f&&c.f.tel?`<div class="acts"><a class="btn act tel" href="tel:+54${esc(c.f.tel)}">Llamar al cliente · ${esc(c.f.tel)}</a><a class="btn act wsp" target="_blank" rel="noopener" href="https://wa.me/549${esc(c.f.tel)}">WhatsApp al cliente</a></div>`:""}${c.closed?"":`<div class="acts"><a class="btn act mod" target="_blank" rel="noopener" href="${formLink(c,"MODIFICAR")}">Modificar búsqueda</a><a class="btn act del" target="_blank" rel="noopener" href="${formLink(c,"CERRAR")}">Cerrar búsqueda</a></div>`}</div>
    <div class="stats">${[["Encontradas",P.length],["Con WhatsApp",P.filter(p=>p.wa).length],["Consultadas",cnt("consultada")],["Comparten",cnt("comparte")],["Enviadas",cnt("enviada")]].map(([l,n])=>`<div class="stat"><strong>${n}</strong>${l}</div>`).join("")}</div></div>
    <div class="req">${c.req.map(r=>`<span class="chip">${r}</span>`).join("")}</div>
    <div class="toolbar" role="group" aria-label="Filtrar">${[["all","Todas"],["cabaprop","Cabaprop compartidas"],["portal","Otros portales"],["wa","Con WhatsApp"]].map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${k===filt}">${l}</button>`).join("")}</div>`;
  const sel=P.filter(p=>filt==="all"||(filt==="wa"?p.wa:p.g===filt));
  const groups=[["cabaprop","Cabaprop · compartidas","Comparten honorarios. Consultar disponibilidad."],["portal","Zonaprop, Argenprop y MercadoLibre","Hay que preguntar si comparten."]];
  document.getElementById("list").innerHTML=groups.map(([g,t,s])=>{const it=sel.filter(p=>p.g===g).sort((a,b)=>(a.alt?1:0)-(b.alt?1:0)||(a.price>c.budget)-(b.price>c.budget)||a.price-b.price);

}
