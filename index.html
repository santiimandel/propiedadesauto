<style>
/* Layout: ficha del cliente arriba, resumen por estado, tarjetas de propiedades en grilla agrupadas por fuente */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dfe3dd;
  --accent:#2f6b4f; --accent-soft:#e3efe8;
  --warn:#9a5b00; --warn-soft:#fbefd9;
  --info:#285d8f; --info-soft:#e2ecf6;
  --bad:#9b2c2c; --bad-soft:#f7e3e3;
  --display:"Fraunces", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa69f; --line:#2c3531;
  --accent:#7cc39d; --accent-soft:#1f3329; --warn:#e9b25c; --warn-soft:#3a2d17;
  --info:#8ab8e6; --info-soft:#1c2c3c; --bad:#ec8b8b; --bad-soft:#3a2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1c2320; --fg:#e7ece8; --muted:#9aa69f; --line:#2c3531;
  --accent:#7cc39d; --accent-soft:#1f3329; --warn:#e9b25c; --warn-soft:#3a2d17;
  --info:#8ab8e6; --info-soft:#1c2c3c; --bad:#ec8b8b; --bad-soft:#3a2020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:28px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px)} h2{font-size:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.client{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.client-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.req{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip b{font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.stat strong{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.toolbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.toolbar button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:12px}
.sec-head{display:flex;align-items:baseline;gap:10px}
.sec-head span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.car{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--bg);margin:-4px 0 2px}
.car-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.car-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.car-btn.prev{left:8px}.car-btn.next{right:8px}
.car-cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.card.alt{border-style:dashed}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.addr{font-weight:700;font-size:16px;line-height:1.3}
.zone{color:var(--muted);font-size:13px}
.price{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.over{font-size:11px;font-weight:700;color:var(--warn);display:block;text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.facts b{color:var(--fg);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.agency{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;width:100%}
.btn.act{flex:1 1 150px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;font-size:16px;font-weight:800;border-radius:12px;border:0;text-align:center}
.btn.act.tel{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.btn.act.wsp{background:var(--accent);color:var(--surface)}
.btn.act.mod{background:#f5c518;color:#2b2000}
.btn.act.del{background:#c0392b;color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.act.mod{background:#e9b82a;color:#241a00}:root:not([data-theme="light"]) .btn.act.del{background:#d9534f;color:#fff}}
:root[data-theme="dark"] .btn.act.mod{background:#e9b82a;color:#241a00}
:root[data-theme="dark"] .btn.act.del{background:#d9534f;color:#fff}
.btn.act:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn{font-weight:700;text-decoration:none;border-radius:8px;padding:5px 10px;font-size:13px}
.btn.wa{background:var(--accent);color:var(--surface)}
.btn.src{border:1px solid var(--line);color:var(--fg)}
.state{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 9px;background:var(--info-soft);color:var(--info);white-space:nowrap}
.legend{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

<style>
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.state.s-consultada{background:var(--warn-soft);color:var(--warn)}

.state.s-no{background:var(--bad-soft);color:var(--bad)}
.state.s-enviada{background:var(--accent);color:var(--surface)}
</style>
